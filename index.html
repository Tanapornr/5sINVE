<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หน้าแรก | 5S Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        invenavy: '#064D6C',
                        invegreen: '#A4B644',
                    }
                }
            }
        }
    </script>
    <style>
        /* ล็อคไม่ให้เลื่อนซ้าย-ขวาบนมือถือ */
        body, html { 
            background-color: #ffffff; 
            overflow-x: hidden;
            width: 100%;
        }

        /* พื้นหลังไล่สี */
        .hero-bg {
            background: linear-gradient(180deg, rgba(164,182,68,0.15) 0%, rgba(6,77,108,0.05) 60%, rgba(255,255,255,1) 100%);
        }

        /* เอฟเฟกต์ตัวหนังสือขอบหนา 3 มิติ สีเขียว */
        .sticker-text-green {
            color: #A4B644;
            text-shadow: 
                -2px -2px 0 #064D6C,  
                 2px -2px 0 #064D6C,
                -2px  2px 0 #064D6C,
                 2px  2px 0 #064D6C,
                 0px  4px 0px #064D6C;
            letter-spacing: -1px;
            transform: skewX(-5deg);
        }

        /* เอฟเฟกต์ตัวหนังสือขอบหนา 3 มิติ สีน้ำเงิน */
        .sticker-text-navy {
            color: #064D6C;
            text-shadow: 
                -2px -2px 0 #ffffff,  
                 2px -2px 0 #ffffff,
                -2px  2px 0 #ffffff,
                 2px  2px 0 #ffffff,
                 0px  3px 8px rgba(0,0,0,0.15);
            letter-spacing: -1px;
        }

        /* เมนู Desktop */
        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            color: #064D6C;
            transition: color 0.2s;
        }
        .nav-link:hover { color: #A4B644; }

        /* ภาพวาดตกแต่งพื้นหลัง */
        .bg-element {
            position: absolute;
            z-index: 0;
            opacity: 0.3;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body class="antialiased">

    <nav class="absolute top-0 w-full z-50 px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="inve-logo.png" alt="INVE Aquaculture" class="h-10 md:h-14 object-contain drop-shadow-sm">
            
            <div class="h-8 border-l-2 border-gray-300"></div>
            <span class="font-extrabold text-lg md:text-2xl text-invenavy tracking-tight">ระบบ 5ส</span>
        </div>

        <div class="hidden md:flex gap-8">
            <a href="policies.html" class="nav-link">หลักการ 5ส ↗</a>
            <a href="policies.html" class="nav-link">คู่มือปฏิบัติงาน ↗</a>
        </div>

        <div class="flex items-center gap-3 text-invenavy">
            <button class="font-bold flex items-center gap-1 hover:text-invegreen transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <span class="hidden md:block">ค้นหา</span>
            </button>
            <button class="md:hidden block">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </nav>

    <section class="hero-bg relative min-h-[100dvh] flex flex-col items-center justify-end pt-20 pb-10 overflow-hidden">
        
        <img src="https://cdn-icons-png.flaticon.com/512/3165/3165695.png" class="bg-element w-32 md:w-64 -left-10 md:left-10 top-24 md:top-32 opacity-10" alt="bg graphic">
        <img src="https://cdn-icons-png.flaticon.com/512/4149/4149679.png" class="bg-element w-40 md:w-72 -right-12 md:right-10 top-32 md:top-40 opacity-10" alt="bg graphic">

        <div class="relative z-10 flex flex-col items-center text-center w-full max-w-5xl mx-auto px-4 mt-auto">
            
            <img 
                src="https://www.pngplay.com/wp-content/uploads/7/Business-Man-Standing-Transparent-Background.png" 
                alt="Representative" 
                class="h-[250px] sm:h-[320px] md:h-[500px] object-contain drop-shadow-xl -mb-6 md:-mb-10 relative z-20"
            >

            <div class="relative z-30 flex flex-col items-center w-full">
                
                <div class="transform -rotate-2 mb-1 md:mb-2">
                    <h2 class="text-2xl md:text-5xl font-black text-white bg-invenavy px-3 py-1 md:px-4 inline-block uppercase tracking-widest border-2 md:border-4 border-invenavy shadow-lg">
                        พื้นที่ทำงาน
                    </h2>
                </div>
                
                <h1 class="text-[3.5rem] leading-[1] md:text-9xl font-black sticker-text-green uppercase mb-2 md:mb-6 w-full truncate">
                    ยอดเยี่ยม
                </h1>

                <h3 class="text-3xl md:text-7xl font-black sticker-text-navy mb-4 md:mb-6">
                    5 หลักการ 5ส
                </h3>

                <p class="text-sm md:text-2xl font-medium text-gray-700 mb-6 md:mb-8 max-w-[90%] md:max-w-2xl leading-relaxed">
                    ระบบ Digital Project Management <br>
                    ที่ออกแบบมาเพื่อลดความซ้ำซ้อน เพิ่มประสิทธิภาพ<br>
                    <span class="font-bold text-invenavy">พร้อมเริ่มต้นปฏิบัติงานทันที</span>
                </p>

                <a href="policies.html" class="bg-[#8ec63f] hover:bg-[#7ebd34] text-white font-bold text-lg md:text-xl px-8 py-3 md:px-10 md:py-4 rounded-md shadow-[0_5px_0_#5a8c22] active:shadow-[0_0px_0_#5a8c22] active:translate-y-[5px] transition-all flex items-center gap-2">
                    ดูนโยบาย
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </a>
            </div>
        </div>
    </section>

</body>
</html>
